<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>最高タワー工房</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-row">
        <h1>最高タワー工房</h1>
        <span class="stage-no" id="stage-no"></span>
        <span class="stage-name" id="stage-name"></span>
        <div class="top-actions">
          <button type="button" id="open-sheet" class="ghost">ふりかえり</button>
          <button type="button" id="open-menu" class="ghost">ステージ一覧</button>
        </div>
      </div>
      <div class="hazard" aria-hidden="true"></div>
    </header>

    <main class="layout">
      <aside class="panel" aria-label="道具">
        <section class="order-card">
          <h2>依頼書</h2>
          <p id="request"></p>
        </section>

        <section>
          <h2>材料</h2>
          <div class="materials" id="materials"></div>
        </section>

        <section>
          <h2>道具</h2>
          <div class="buttons">
            <button type="button" class="tool active" data-tool="place">部材を置く</button>
            <button type="button" class="tool" data-tool="erase">部材を消す</button>
          </div>
        </section>

        <section id="stage-tools">
          <div class="buttons">
            <button type="button" id="show-hint">ヒント</button>
            <button type="button" id="restart">最初に戻す</button>
          </div>
        </section>

        <section id="samples">
          <h2>見本</h2>
          <div class="buttons">
            <button type="button" id="sample-square">四角い枠</button>
            <button type="button" id="sample-braced">筋交い入り</button>
            <button type="button" id="clear">全部消す</button>
          </div>
        </section>

        <section class="stats">
          <div class="stat">
            <span class="stat-label">高さ</span>
            <span class="stat-value"><strong id="stat-height">0</strong><small id="stat-goal"></small></span>
          </div>
          <div class="stat" id="cost-line">
            <span class="stat-label">費用</span>
            <span class="stat-value"><strong id="stat-cost">0</strong><small id="stat-budget"></small></span>
          </div>
        </section>

        <section>
          <h2>地震</h2>
          <p class="quake-fixed" id="quake-fixed"></p>
          <div id="quake-choice">
            <label>強さ
              <select id="quake-level"></select>
            </label>
            <label>揺れ方
              <select id="quake-type"></select>
            </label>
          </div>
          <label class="check"><input type="checkbox" id="slow" /> スロー再生</label>
          <div class="buttons quake-buttons">
            <button type="button" id="start" class="go">地震スタート！</button>
            <button type="button" id="reset" disabled>建て直す</button>
          </div>
        </section>

        <section class="legend" aria-label="色の見方">
          <h2>色の見方（地震中）</h2>
          <div class="scale"><span>余裕</span><span class="bar"></span><span>こわれそう</span></div>
          <p>丸はつなぎ目。赤い丸は曲がりすぎて危ないつなぎ目、×はこわれたつなぎ目です。</p>
        </section>
      </aside>

      <div class="stage">
        <p class="hint" id="hint"></p>
        <canvas id="canvas"></canvas>
        <div class="predict-box" id="predict-box" hidden>
          <h3>試験の前に予想しよう</h3>
          <p id="predict-text">いちばん先にこわれそうな部材をタップしてください。</p>
          <div class="buttons">
            <button type="button" id="predict-none">どこもこわれないと思う</button>
            <button type="button" id="predict-cancel">やめる</button>
            <button type="button" id="predict-go" class="go" disabled>この予想で地震スタート！</button>
          </div>
        </div>
        <div class="result" id="result" hidden></div>
        <div class="replay-bar" id="replay-bar" hidden>
          <button type="button" id="replay-play" aria-label="再生・一時停止">一時停止</button>
          <input type="range" id="replay-seek" min="0" max="1000" value="0" aria-label="再生する位置" />
          <span class="replay-time" id="replay-time">0.0秒</span>
          <button type="button" id="replay-break">最初にこわれた瞬間へ</button>
          <label class="replay-speed">速さ
            <select id="replay-speed">
              <option value="0.1">1/10</option>
              <option value="0.25" selected>1/4</option>
              <option value="0.5">1/2</option>
              <option value="1">ふつう</option>
            </select>
          </label>
          <button type="button" id="replay-close" class="primary">結果にもどる</button>
        </div>
      </div>
    </main>

    <div class="menu" id="menu" hidden>
      <div class="menu-card">
        <h2>ステージを選ぼう</h2>
        <div id="menu-list"></div>
        <div class="menu-free">
          <button type="button" id="free-mode">自由に作る（実験モード）</button>
        </div>
      </div>
    </div>

    <div class="menu sheet" id="sheet" hidden>
      <div class="menu-card sheet-card">
        <div class="sheet-head">
          <h2>ふりかえりシート</h2>
          <span class="sheet-title-print">最高タワー工房</span>
        </div>
        <div class="sheet-names">
          <label>名前 <input type="text" id="note-name" data-note="name" autocomplete="off" /></label>
          <label>組・班 <input type="text" id="note-group" data-note="group" autocomplete="off" /></label>
        </div>
        <h3>試験の記録</h3>
        <div id="sheet-attempts"></div>
        <h3>考えたこと</h3>
        <div id="sheet-questions"></div>
        <div class="buttons sheet-actions">
          <button type="button" id="sheet-print" class="primary">印刷する</button>
          <button type="button" id="sheet-clear">記録を消す</button>
          <button type="button" id="sheet-close">閉じる</button>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
